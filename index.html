<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmo-turbiks — Звуковая Лаборатория</title>
    <style>
        body {
            background-color: #0a0510;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffcc00;
            text-shadow: 0 0 10px #ff6600;
            text-align: center;
        }
        .sounds-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .sound-card {
            background: #1a0a2e;
            border: 2px solid #5a3a8a;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 15px rgba(90, 58, 138, 0.5);
        }
        .sound-card p {
            margin: 0 0 10px 0;
            font-weight: bold;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <h1>🚀 Cosmo-turbiks: Испытательный Полигон</h1>
    
    <div class="sounds-container">
        <!-- Кнопка 1: Ваня -->
        <div class="sound-card">
            <p>Кнопка 1</p>
            <iframe width="110" height="200" src="https://www.myinstants.com/instant/vania-zhirnyi-govnoed-3964/embed/" frameborder="0" scrolling="no"></iframe>
        </div>

        <!-- Кнопка 2: Шахед -->
        <div class="sound-card">
            <p>Кнопка 2</p>
            <iframe width="110" height="200" src="https://www.myinstants.com/instant/litit-shakhed-z-motorchikom-61527/embed/" frameborder="0" scrolling="no"></iframe>
        </div>
    </div>

</body>
</html>
